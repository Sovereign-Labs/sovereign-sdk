# Demo rollup config for `--da-layer celestia-fibre`.
# `[da]` is `sov_celestia_fibre_adapter::CelestiaFibreConfig`.
# Both the batch and the proof namespace are posted and read through Fibre, so the
# sequencer and the prover signer need a funded Fibre escrow. There is no archive:
# blocks older than validator shard retention cannot be fetched.

[da]
rpc_url = "ws://127.0.0.1:26658"
# rpc_auth_token = "MY.SECRET.TOKEN"
# grpc_url = "http://127.0.0.1:9090"
# grpc_auth_token = ""
# signer_private_key comes from SOV_CELESTIA_SIGNER_KEY when omitted.
# fibre_grpc_url defaults to grpc_url when omitted.
# download_timeout_secs = 120
# verify_on_fetch = "off"

[storage]
# The path to the rollup's data directory. Paths that do not begin with `/` are interpreted as relative paths.
path = "demo_data"
state_cache_size = 4294967296 # 4 GiB. Default is 1 GiB.
user_commit_concurrency = 4 # Number of concurrent commit workers for user state
user_hashtable_buckets = 1_000_000 # Expected state size, cannot be changed after creation
user_preallocate_ht = false
kernel_commit_concurrency = 2 # Number of concurrent commit workers for kernel state

# State-version pruning policy. Omit this section to disable pruning.
[storage.pruner.periodic]
block_interval = 100 # How often to run the pruner, measured in DA blocks
versions_to_keep = 20 # Number of versions available for historical querying

[runner]
# 3 times per regular celestia block
da_polling_interval_ms = 1_000

[runner.http_config]
bind_host = "127.0.0.1"
bind_port = 12346
# The fully qualified public name of the server, in case the rollup is running behind a proxy
# public_address = "http://rollup.sovereign.xyz"

[monitoring]
telegraf_address = "udp://127.0.0.1:8094"
# Defines how many measurements a rollup node will accumulate before sending it to the Telegraf.
# It is expected from the rollup node to produce metrics all the time,
# so measurements are buffered by size and not sent by time.
# and below 67 KB, which is the maximal UDP packet size.
# It also means that if a single serialized metric is larger than this value, a UDP packet will be larger.
# The default value is 508.
# max_datagram_size = 508
# How many metrics are allowed to be in pending state, before new metrics will be dropped.
# This is a number of metrics, not serialized bytes.
# The total number of bytes to be held in memory might vary per metric + `max_datagram_size`
# max_pending_metrics = 1000

[proof_manager]
aggregated_proof_block_jump = 10
prover_address = "sov1lzkjgdaz08su3yevqu6ceywufl35se9f33kztu5cu2spja5hyyf"
max_number_of_transitions_in_db = 1000
max_number_of_transitions_in_memory = 100
max_number_of_aggregated_proofs_in_memory = 5
# Cap on the number of proof blobs in flight on the DA layer at any given time.
# Keep this value LARGE. If the cap is reached the ZK aggregator interprets it
# as "proofs are not being confirmed by the rollup on time" and triggers a full
# rollup shutdown to avoid building an unbounded backlog. Set it high enough
# that transient DA slowness or proving bursts cannot saturate the in-flight
# count under normal operation.
max_concurrent_proof_blobs = 1024

[sequencer]
# This value is counted between sequencer receiving receipt from DA about inclusion till node has processed this blob.
# Kept at/below the deferred-slots recovery window (~295s at a 3s block time) so recovery is
# attempted before this hard timeout shuts the rollup down.
blob_processing_timeout_secs = 300
max_batch_size_bytes = 1048576
max_concurrent_batch_blobs = 128
max_allowed_node_distance_behind = 10
rollup_address = "sov1lzkjgdaz08su3yevqu6ceywufl35se9f33kztu5cu2spja5hyyf"
[sequencer.preferred]
# TODO: Remove it when https://github.com/Sovereign-Labs/sovereign-sdk-wip/issues/2814 is resolved
disable_state_root_consistency_checks = true
# Strategy for handling recovery scenarios when the sequencer is too far behind.
# "None" - Shutdown the sequencer instead of attempting recovery (default)
# "TryToSave" - Attempt to recover by flushing batches and catching up with the chain
recovery_strategy = "TryToSave"
batch_execution_time_limit_millis = 6000 # Do no more than 6 seconds worth of work per batch, even if the DA layer isn't producing blocks regularly
# The sequencer optimistically pre-executes transactions across multiple worker threads.
# This warms up caches so the main transaction executor can run with ready-to-use data.
# This variable determines the number of worker threads.

num_cache_warmup_workers = 0
[sequencer.extension]
max_log_limit = 20000
