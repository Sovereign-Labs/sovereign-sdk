[package]
name = "sov-aggregated-proof"
version = "0.1.0"
edition = "2021"
license = { workspace = true }
publish = false


[[bin]]
name = "sov-aggregated-proof"
path = "script/src/main.rs"

[dependencies]
anyhow = "1.0.95"
bincode = "1.3.3"
demo-stf = { workspace = true, features = ["native"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1.0"
slop-algebra = "6.0.2"
sp1 = { path = "../../../provers/sp1" }
sp1-core-executor = "6.0.2"
sp1-recursion-executor = "6.0.2"
sp1-sdk = { version = "6.0.2", default-features = false, features = ["blocking"] }
sov-mock-da = { workspace = true, features = ["native"] }
sov-mock-zkvm = { workspace = true, features = ["native"] }
sov-modules-api = { workspace = true }
sov-rollup-interface = { workspace = true }
sov-sp1-adapter = { workspace = true, features = ["native"] }
