[package]
name = "sov-demo-rollup"
version = "0.3.0"
authors = { workspace = true }
edition = { workspace = true }
homepage = { workspace = true }
license = "Sovereign Permissionless Commercial License"
repository = { workspace = true }
publish = false
default-run = "sov-demo-rollup"

[lints]
workspace = true

[dependencies]
# non-optional dependencies
sov-address = { workspace = true, features = ["evm"] }
sov-celestia-adapter = { workspace = true, features = ["native"] }
sov-mock-da = { workspace = true, features = ["native"] }
sov-rollup-interface = { workspace = true, features = ["native"] }
sov-stf-runner = { workspace = true }
sov-metrics = { workspace = true, features = ["native"] }

# Sovereign crates
sov-bank = { workspace = true, features = ["native"] }
sov-blob-storage = { workspace = true, features = ["native"], optional = true }
sov-chain-state = { workspace = true, features = ["native"], optional = true }
sov-paymaster = { workspace = true, features = ["native"], optional = true }
sov-sequencer-registry = { workspace = true, features = ["native"], optional = true }
sov-cli = { workspace = true }
sov-db = { workspace = true }
sov-ethereum = { workspace = true, features = ["local"] }
sov-kernels = { workspace = true, features = ["native"] }
sov-mock-zkvm = { workspace = true, features = ["native"] }
sov-modules-api = { workspace = true, features = ["native"] }
sov-modules-rollup-blueprint = { workspace = true, features = ["native"] }
sov-modules-stf-blueprint = { workspace = true, features = ["native"] }
sov-solana-offchain-auth = { workspace = true }
sov-risc0-adapter = { workspace = true, features = ["native"] }
sov-sequencer = { workspace = true }
sov-sp1-adapter = { workspace = true, features = ["native"] }
rustls = { workspace = true, features = ["ring"] }
sov-full-node-configs = { workspace = true }
sov-state = { workspace = true, features = ["native"] }
sov-eth-dev-signer = { workspace = true }

demo-stf = { workspace = true, features = ["native"] }

risc0 = { path = "./provers/risc0" }
sp1 = { path = "./provers/sp1" }

borsh = { workspace = true, features = ["bytes", "derive"] }
async-trait = { workspace = true }
anyhow = { workspace = true }
axum = { workspace = true }
schemars = { workspace = true }
serde = { workspace = true, default-features = false, features = [
    "alloc",
    "derive",
] }
serde_json = { workspace = true, default-features = false, features = [
    "alloc",
] }
hex = { workspace = true, optional = true }
bincode = { workspace = true, optional = true }
tokio = { workspace = true, features = [
    "rt-multi-thread",
    "sync",
    "time",
    "macros",
    "tracing",
] }
tokio-stream = { workspace = true }
tracing = { workspace = true }
rockbound = { workspace = true, optional = true }
clap = { workspace = true, features = ["derive"] }
secp256k1 = { workspace = true, features = ["global-context", "recovery"] }
alloy = { workspace = true, features = ["genesis"] }
alloy-primitives = { workspace = true }
alloy-rlp = { workspace = true }


[dev-dependencies]
sov-eth-client = { workspace = true }
jsonrpsee = { workspace = true }
sov-address = { workspace = true, features = ["native"] }
sov-risc0-adapter = { workspace = true, features = ["native"] }
sov-celestia-adapter = { workspace = true, features = ["native"] }
sov-mock-zkvm = { workspace = true, features = ["native"] }
sov-rollup-interface = { workspace = true }
sov-modules-api = { workspace = true, features = [
    "native",
    "test-utils",
] }
sov-mock-da = { workspace = true }
sov-bank = { workspace = true, features = ["native"] }
sov-sequencer-registry = { workspace = true, features = [
    "native",
] }
sov-accounts = { workspace = true, features = ["native"] }
sov-api-spec = { workspace = true }
sov-evm = { workspace = true, features = ["native"] }
sov-hyperlane-integration = { workspace = true, features = ["evm"] }
sov-modules-macros = { workspace = true }
sov-test-utils = { workspace = true }
sov-evm-test-utils = { workspace = true }
sov-chain-state = { workspace = true }
sov-blob-storage = { workspace = true }
sov-synthetic-load = { workspace = true, features = ["native"] }
reth-primitives = { workspace = true, default-features = false }
futures = { workspace = true }
demo-stf = { workspace = true, features = ["native"] }
demo-stf-json-client = { path = "./stf/demo-stf-json-client", default-features = false }
tracing-panic = { version = "0.1.2" }

base64 = { workspace = true }
bincode = { workspace = true }
hex = { workspace = true }
sha2 = { workspace = true }
tempfile = { workspace = true }
tokio = { workspace = true, features = ["full"] }
tracing-subscriber = { workspace = true }
rand = { workspace = true }

alloy-primitives = { workspace = true }
alloy-rpc-types-eth = { workspace = true }
alloy-rpc-types-trace = { workspace = true }
alloy-pubsub = { workspace = true }
alloy-provider = { workspace = true, features = ["debug-api", "reqwest"] }
sov-rpc-eth-types = { workspace = true }
strum = { workspace = true }


reqwest = { workspace = true }
sov-proxy-utils = { workspace = true }
testcontainers = { workspace = true }

[build-dependencies]
anyhow = { workspace = true }
sov-zkvm-utils = { workspace = true }


[features]
default = []
# Used for using different encoding between host and guest
bincode = ["risc0/bincode", "sov-risc0-adapter/bincode"]
migration-script = [
    "dep:sov-blob-storage",
    "dep:rockbound",
    "dep:bincode",
    "dep:hex",
    "dep:sov-chain-state",
    "dep:sov-paymaster",
    "dep:sov-sequencer-registry",
    "sov-db/migration-script",
]

[[bin]]
name = "sov-cli"
path = "src/sov-cli/main.rs"

[[bin]]
name = "sov-demo-rollup"
path = "src/main.rs"

[[bin]]
name = "demo-celestia-tester"
path = "src/da_tester/demo_celestia_tester.rs"

[[bin]]
name = "mockda-to-celestia-migrate"
path = "src/migrations/mockda_to_celestia.rs"
required-features = ["migration-script"]

[[bin]]
name = "sov-hive-genesis-adapter"
path = "src/hive/genesis_adapter.rs"
