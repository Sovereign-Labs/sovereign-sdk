[package]
name = "sov-demo-rollup"
version = "0.3.0"
authors = { workspace = true }
edition = { workspace = true }
homepage = { workspace = true }
license = "Sovereign Permissionless Commercial License"
repository = { workspace = true }
publish = false
default-run = "sov-demo-rollup"
# Integration tests are declared explicitly as [[test]] (gated on `mock_da`); disable
# auto-discovery so helper files under tests/ aren't compiled as standalone test bins.
autotests = false

[lints]
workspace = true

[dependencies]
# non-optional dependencies
sov-address = { workspace = true, features = ["evm"] }
sov-rollup-interface = { workspace = true, features = ["native"] }
sov-shutdown = { workspace = true }
sov-rollup-full-node-interface = { workspace = true }
sov-stf-runner = { workspace = true }

# Sovereign crates
sov-accounts = { workspace = true, features = ["native"] }
sov-bank = { workspace = true, features = ["native"] }
sov-blob-storage = { workspace = true, features = ["native"] }
sov-chain-state = { workspace = true, features = ["native"] }
sov-paymaster = { workspace = true, features = ["native"] }
sov-sequencer-registry = { workspace = true, features = ["native"] }
sov-cli = { workspace = true }
sov-db = { workspace = true }
sov-ethereum = { workspace = true, features = ["local"] }
sov-kernels = { workspace = true, features = ["native"] }
sov-migrations = { workspace = true }
sov-mock-zkvm = { workspace = true, features = ["native"] }
sov-modules-api = { workspace = true, features = ["native"] }
sov-node-client = { workspace = true }
sov-modules-rollup-blueprint = { workspace = true, features = ["native"] }
sov-modules-stf-blueprint = { workspace = true, features = ["native"] }
sov-solana-offchain-auth = { workspace = true }
sov-sequencer = { workspace = true }
rustls = { workspace = true, features = ["ring"] }
sov-full-node-configs = { workspace = true }
sov-state = { workspace = true, features = ["native"] }
sov-eth-dev-signer = { workspace = true }

demo-stf = { workspace = true, features = ["native"] }

# DA adapters, zkVM adapters and zkVM guest-ELF crates, feature-gated by DA layer.
# `mock_da` pulls mock-da + sp1; `celestia_da` pulls celestia + risc0. See [features].
# `sov-mock-zkvm` stays non-optional (outer VM for both DAs + light-client mock verifier).
sov-mock-da = { workspace = true, features = ["native"], optional = true }
sov-sp1-adapter = { workspace = true, features = ["native"], optional = true }
sp1 = { path = "./provers/sp1", optional = true }
sov-celestia-adapter = { workspace = true, features = ["native"], optional = true }
sov-risc0-adapter = { workspace = true, features = ["native"], optional = true }
risc0 = { path = "./provers/risc0", optional = true }

borsh = { workspace = true, features = ["bytes", "derive"] }
async-trait = { workspace = true }
anyhow = { workspace = true }
axum = { workspace = true }
serde = { workspace = true, default-features = false, features = [
    "alloc",
    "derive",
] }
serde_json = { workspace = true, default-features = false, features = [
    "alloc",
] }
hex = { workspace = true }
bincode = { workspace = true }
tokio = { workspace = true, features = [
    "rt-multi-thread",
    "sync",
    "time",
    "macros",
    "tracing",
] }
tracing = { workspace = true }
rockbound = { workspace = true }
clap = { workspace = true, features = ["derive"] }
secp256k1 = { workspace = true, features = ["global-context", "recovery"] }
alloy = { workspace = true, features = ["genesis"] }
alloy-primitives = { workspace = true }
alloy-rlp = { workspace = true }

[dev-dependencies]
sov-eth-client = { workspace = true }
jsonrpsee = { workspace = true }
schemars = { workspace = true }
sov-address = { workspace = true, features = ["native"] }
sov-mock-zkvm = { workspace = true, features = ["native"] }
sov-rollup-interface = { workspace = true }
sov-modules-api = { workspace = true, features = [
    "native",
    "test-utils",
] }
sov-mock-da = { workspace = true }
sov-bank = { workspace = true, features = ["native"] }
sov-sequencer-registry = { workspace = true, features = [
    "native",
] }
sov-accounts = { workspace = true, features = ["native"] }
sov-api-spec = { workspace = true }
sov-evm = { workspace = true, features = ["native"] }
sov-hyperlane-integration = { workspace = true, features = ["evm"] }
sov-modules-macros = { workspace = true }
sov-test-utils = { workspace = true }
sov-evm-test-utils = { workspace = true }
sov-chain-state = { workspace = true }
sov-blob-storage = { workspace = true }
sov-synthetic-load = { workspace = true, features = ["native"] }
futures = { workspace = true }
demo-stf = { workspace = true, features = ["native"] }
demo-stf-json-client = { path = "./stf/demo-stf-json-client", default-features = false }
tracing-panic = { version = "0.1.2" }

base64 = { workspace = true }
bincode = { workspace = true }
hex = { workspace = true }
sha2 = { workspace = true }
tempfile = { workspace = true }
tokio = { workspace = true, features = ["full"] }
tokio-tungstenite = { workspace = true, features = ["connect"] }
tracing-subscriber = { workspace = true }
rand = { workspace = true }

alloy-primitives = { workspace = true }
alloy-rpc-types-eth = { workspace = true }
alloy-rpc-types-trace = { workspace = true }
alloy-pubsub = { workspace = true }
alloy-provider = { workspace = true, features = ["debug-api", "reqwest"] }
sov-rpc-eth-types = { workspace = true }
strum = { workspace = true }


reqwest = { workspace = true }
sov-proxy-utils = { workspace = true }
testcontainers = { workspace = true }

[package.metadata.cargo-machete]
ignored = ["schemars"]

[build-dependencies]
anyhow = { workspace = true }
sov-zkvm-utils = { workspace = true }


[features]
default = ["mock_da"]

# Features are split by DA layer; each bundles that DA's zkVM(s). The zkVM is then
# chosen at runtime via `--zk-vm`. Compile time is dominated by zkVM guest builds, so
# splitting this way lets a build skip the other DA's guests entirely:
#   mock_da:     mock-DA rollups w/ MockZkvm + SP1   -> builds 2 SP1 guests (mock + aggregation)
#   celestia_da: Celestia rollup w/ Risc0 + MockZkvm -> builds the risc0 guest(s)
# `--all-features` compiles BOTH DAs (and all their guests); `--da-layer`/`--zk-vm`
# select at runtime. When both DA features are enabled, mock_da is the default DA
# (the `--da-layer` default is `mock`), so `--all-features` runs normally without
# extra flags. A combo whose feature isn't compiled in bails at startup.
mock_da = ["dep:sov-mock-da", "dep:sov-sp1-adapter", "dep:sp1"]
celestia_da = ["dep:sov-celestia-adapter", "dep:sov-risc0-adapter", "dep:risc0"]

[[bin]]
name = "sov-cli"
path = "src/sov-cli/main.rs"

[[bin]]
name = "sov-demo-rollup"
path = "src/main.rs"

[[bin]]
name = "light-client"
path = "src/light_client/main.rs"
# The light client decodes proofs against the mock-DA rollup spec (mock + sp1 outer VMs);
# there is no Celestia verifier yet, so it only builds for mock-DA rollups.
required-features = ["mock_da"]

[[bin]]
name = "demo-celestia-tester"
path = "src/da_tester/demo_celestia_tester.rs"
required-features = ["celestia_da"]

[[bin]]
name = "mockda-to-celestia-migrate"
path = "src/migrations/mockda_to_celestia.rs"

[[bin]]
name = "migrate_to_v1"
path = "src/migrations/legacy_accounts.rs"

[[bin]]
name = "sov-hive-genesis-adapter"
path = "src/hive/genesis_adapter.rs"

# All integration tests run on mock DA (mock + sp1 zkVMs), so they live under `mock_da`
# (the default). `external_mock_da.rs` / `test_helpers.rs` are helper modules of
# `all_tests` (pulled via `mod`); test auto-discovery is disabled (`autotests = false`
# in [package]) so only this single real test binary is built, gated on its feature.
[[test]]
name = "all_tests"
path = "tests/all_tests.rs"
required-features = ["mock_da"]
