[package]
name = "sov-demo-prover-guest-mock-sp1"
version = "0.3.0"
license = "MIT OR Apache-2.0"
edition = "2021"
resolver = "2"

[workspace]

[dependencies]
anyhow = { version = "1.0.95" }
sp1-zkvm = { version = "6.0.2" }
sov-mock-da = { path = "../../../../../crates/adapters/mock-da" }
demo-stf = { path = "../../../stf" }
sov-sp1-adapter = { path = "../../../../../crates/adapters/sp1" }
sov-mock-zkvm = { path = "../../../../../crates/adapters/mock-zkvm" }
sov-modules-api = { path = "../../../../../crates/module-system/sov-modules-api" }
sov-address = { path = "../../../../../crates/module-system/sov-address" }
sov-state = { path = "../../../../../crates/module-system/sov-state" }
sov-modules-stf-blueprint = { path = "../../../../../crates/module-system/sov-modules-stf-blueprint" }
sov-kernels = { path = "../../../../../crates/module-system/sov-kernels" }
sov-metrics = { path = "../../../../../crates/full-node/sov-metrics", optional = true, features = [
    "sp1",
] }
sha2 = { version = "0.10", default-features = false }

[patch.crates-io]
sha2-v0-9-9 = { git = "https://github.com/sp1-patches/RustCrypto-hashes", package = "sha2", tag = "patch-sha2-0.9.9-sp1-6.0.0" }
sha2-v0-10-9 = { git = "https://github.com/sp1-patches/RustCrypto-hashes", package = "sha2", tag = "patch-sha2-0.10.9-sp1-6.0.0" }
curve25519-dalek = { git = "https://github.com/sp1-patches/curve25519-dalek", tag = "patch-4.1.3-sp1-6.0.0" }
# Needed for ed25519-consensus which depends on curve25519-dalek-ng
curve25519-dalek-ng = { git = "https://github.com/sp1-patches/curve25519-dalek-ng", tag = "patch-4.1.1-sp1-6.0.0" }
# Pin the SP1-compatible ed25519-consensus revision for the v6 guest dependency graph.
ed25519-consensus = { git = "https://github.com/sp1-patches/ed25519-consensus", rev = "78f83b21767077f602f30148e513a52e844abbb6" }
tiny-keccak = { git = "https://github.com/sp1-patches/tiny-keccak", tag = "patch-2.0.2-sp1-6.0.0" }

[profile.dev]
opt-level = 3

[profile.dev.build-override]
opt-level = 3

[profile.release]
debug = 1
lto = true

[profile.release.build-override]
opt-level = 3

[features]
default = []
bench = [
    "sov-modules-api/bench",
    "sov-state/bench",
    "sov-modules-stf-blueprint/bench",
    "sov-metrics",
]
