name: Trigger EVM Acceptance Tests

on:
  # Trigger on pushes to dev
  push:
    branches: ["dev"]
  # Can be triggered manually
  workflow_dispatch:
    inputs:
      commit_sha:
        description: 'Specific commit SHA to test (defaults to HEAD of dev branch)'
        required: false

jobs:
  trigger:
    runs-on: nscloud-ubuntu-22.04-amd64-2x4
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.inputs.commit_sha || 'dev' }}

      - name: Get commit info
        id: commit
        run: |
          echo "sha=$(git rev-parse HEAD)" >> $GITHUB_OUTPUT
          echo "short_sha=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT
          echo "message=$(git log -1 --pretty=%B | head -n1)" >> $GITHUB_OUTPUT

      - name: Trigger EVM test run on server
        env:
          ACCEPTANCE_SERVER_API_TOKEN: ${{ secrets.ACCEPTANCE_SERVER_API_TOKEN }}
          ACCEPTANCE_SERVER_API_URL: ${{ secrets.ACCEPTANCE_SERVER_API_URL }}
          COMMIT_SHA: ${{ steps.commit.outputs.sha }}
        run: |
          echo "Triggering EVM acceptance test for commit ${{ steps.commit.outputs.short_sha }}"
          echo "Commit message: ${{ steps.commit.outputs.message }}"

          if ! response=$(curl -X POST "${ACCEPTANCE_SERVER_API_URL}/start-evm-test" \
            -H "Authorization: Bearer ${ACCEPTANCE_SERVER_API_TOKEN}" \
            -H "Content-Type: application/json" \
            -d "{\"commit_sha\": \"$COMMIT_SHA\"}" \
            -w "\n%{http_code}" -s); then
            echo "❌ Curl command failed; unable to send request"
            exit 1
          fi

          http_code=$(echo "$response" | tail -n1)
          body=$(echo "$response" | head -n-1)

          if [ "$http_code" -ne 200 ]; then
            echo "❌ Failed to trigger EVM test (HTTP $http_code)"
            echo "Response: $body"
            exit 1
          fi

          echo "✅ EVM test triggered successfully"
          echo "$body"
