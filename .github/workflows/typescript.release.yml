name: Release (TypeScript)

on:
  push:
    branches: ["dev"]
  workflow_dispatch:
    inputs:
      branch:
        description: "Branch to run the workflow on"
        required: false
        default: "dev"

concurrency: ${{ github.workflow }}-${{ github.ref }}

permissions: {}
jobs:
  release:
    # prevents this action from running on forks
    if: github.repository == 'Sovereign-Labs/sovereign-sdk'
    permissions:
      contents: write # to create release (changesets/action)
      id-token: write # OpenID Connect token needed for provenance
      pull-requests: write # to create pull request (changesets/action)
    name: Release
    # Must run on a GitHub-hosted runner: npm trusted publishing (OIDC)
    # rejects tokens from self-hosted runners.
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.branch || '' }}
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: ./typescript/package.json
      - uses: actions/setup-node@v6
        with:
          node-version: 24.x
          cache: "pnpm"
          cache-dependency-path: "./typescript/pnpm-lock.yaml"
          registry-url: 'https://registry.npmjs.org'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.2.5
      # CI jobs get wasm-pack from the base image (docker/ci/Dockerfile); keep the version in sync.
      - name: Install wasm-pack
        run: |
          curl -fsSL https://github.com/wasm-bindgen/wasm-pack/releases/download/v0.13.1/wasm-pack-v0.13.1-x86_64-unknown-linux-musl.tar.gz \
            | sudo tar xz -C /usr/local/bin --strip-components=1 wasm-pack-v0.13.1-x86_64-unknown-linux-musl/wasm-pack
      - name: Install dependencies
        run: pnpm install
        working-directory: ./typescript
      - name: Build
        run: pnpm build
        working-directory: ./typescript
      - name: Run Tests
        run: pnpm test
        working-directory: ./typescript
      - name: Create Release Pull Request or Publish to npm
        uses: changesets/action@v1.9.0
        with:
          publish: pnpm release
          version: pnpm pkg-version
          cwd: ./typescript
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_CONFIG_PROVENANCE: true
