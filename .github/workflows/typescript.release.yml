name: Release (TypeScript)

on:
  push:
    branches: ["dev"]
  workflow_dispatch:
    inputs:
      branch:
        description: "Branch to run the workflow on"
        required: false
        default: "dev"

concurrency: ${{ github.workflow }}-${{ github.ref }}

permissions: {}
jobs:
  release:
    # prevents this action from running on forks
    if: github.repository == 'Sovereign-Labs/sovereign-sdk'
    permissions:
      contents: write # to create release (changesets/action)
      id-token: write # OpenID Connect token needed for provenance
      pull-requests: write # to create pull request (changesets/action)
    name: Release
    runs-on: namespace-profile-sov-ubuntu-24-04-amd64-16x32-rust-1-93-v20260602;container.privileged=true;container.host-pid-namespace=true;overrides.cache-tag=typescript-release-1-93
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.branch || '' }}
      # Cache the pnpm store in a Namespace volume.
      - uses: namespacelabs/nscloud-cache-action@v1
        with:
          cache: pnpm
      # Node 24, pnpm, and Bun are baked into the base image; setup-node is kept
      # only to configure the npm registry (.npmrc) for publishing.
      - uses: actions/setup-node@v6
        with:
          registry-url: 'https://registry.npmjs.org'
      - name: Install dependencies
        run: pnpm install
        working-directory: ./typescript
      - name: Build
        run: pnpm build
        working-directory: ./typescript
      - name: Run Tests
        run: pnpm test
        working-directory: ./typescript
      - name: Create Release Pull Request or Publish to npm
        uses: Sovereign-Labs/changesets-action@v1.5.4
        with:
          publish: pnpm release
          version: pnpm pkg-version
          cwd: ./typescript
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_CONFIG_PROVENANCE: true
