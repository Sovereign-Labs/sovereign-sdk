# Rename this file and move it into workflows/ to reactivate dependency review.

name: "Dependency Review"
on: [pull_request]

permissions:
  contents: read

jobs:
  dependency-review:
    runs-on: nscloud-ubuntu-24.04-amd64-2x4
    timeout-minutes: 10
    steps:
      - name: "Checkout Repository"
        uses: actions/checkout@v6
      - name: "Dependency Review"
        # This action publishes no floating major tag; pin a full version.
        uses: actions/dependency-review-action@v4.9.0
        with:
          fail-on-severity: critical
