rockbound = { git = "https://github.com/sovereign-labs/rockbound", rev = "d8b270d399d0d355a19fbeedf9af009baee8ae66" }
nmt-rs = { version = "0.2.5", features = ["serde", "borsh"] }
# External dependencies
nomt-core = { version = "1.0.4", default-features = false, features = ["borsh", "serde"] }
nomt = { version = "1.0.4", default-features = false, features = ["borsh", "serde"] }
concread = { version = "0.5.7" }

anyhow = { version = "1.0.95" }
async-trait = "0.1.81"
arrayvec = "0.7.6"
console-subscriber = "0.5"

axum = { version = "0.8.8", default-features = false }
axum-server = { version = "0.8", features = ["tls-rustls-no-provider"] }
arbitrary = { version = "1.3.2", features = ["derive"] }
backon = { version = "1.5.1", default-features = false, features = ["tokio-sleep"] }
base64 = "0.22"
bs58 = { version = "0.5.1", default-features = false, features = ["std", "alloc"] }
# Pinned exactly (`=`): `sov-blob-storage`'s lazy blob deserialization depends on
# borsh-internal error wording and read behavior. 1.6.1 was verified byte-identical
# to 1.5.7 for those paths. Bump deliberately, in lockstep with downstream lockfiles
# (e.g. rollup-starter), and re-run its `deserialization_tests`; a silent `cargo
# update` must not move it.
borsh = { version = "=1.6.1", features = ["derive"] }
# TODO: Consider replacing this serialization format
#     https://github.com/Sovereign-Labs/sovereign-sdk/issues/283
bincode = "1.3.3"
bcs = "0.2.0"
byteorder = { version = "1.5.0", default-features = false }
bytes = { version = "1.10", default-features = false }
convert_case = { version = "0.6", default-features = false }
chrono = { version = "0.4", default-features = false, features = ["now"] }
darling = "0.21"
derive-new = "0.7.0"
derivative = { version = "2.2", features = ["use_core"] }
digest = { version = "0.10.7", default-features = false, features = ["alloc"] }
# Don't forget to upgrade zkVM patches if changing this one.
ed25519-dalek = { version = "=2.1.1", default-features = false }
futures = { version = "0.3", default-features = false }
hex = { version = "0.4.3" }
insta = { version = "1.39", features = ["json"] }
ipnet = { version = "2.12", features = ["serde", "schemars1"] }
jsonschema = "0.46.4"
once_cell = "1.19"
openapiv3 = "2.0.0"
proc-macro2 = { version = "1.0" }
proptest = { version = "1.5", default-features = false, features = ["std", "alloc"] }
proptest-derive = "0.5.0"
quote = "1.0"
rand = "0.8"
rand_chacha = "0.3.1"
rayon = "1.10.0"
reqwest = { version = "0.13", features = ["default-tls"], default-features = false }
rustls = { version = "0.23", default-features = false }
serde = { version = "1.0.208", default-features = false, features = [
    "alloc",
    "derive",
] }
serde_arrays = "0.1"
serde_json = { version = "1.0", default-features = false, features = ["alloc"] }
serde_yaml = { version = "0.9", default-features = false }
serde_with = { version = "3.19", features = ["schemars_1", "base64"] }
# Pinned version because zkvm-guests rely on patches. Upgrade `examples/demo-rollup/provers/* to use same patch as this one.
sha2 = { version = "=0.10.9", default-features = false }
sha3 = { version = "0.10.8", default-features = false }
strum = { version = "0.28", features = ["derive"] }
syn = { version = "2.0" }
itertools = { version = "0.14.0" }
lz4_flex = { version = "0.11", default-features = false }
thiserror = "2"
tower = { version = "0.5", default-features = false }
tower-http = "0.6"
tower-request-id = "0.3"
tracing = { version = "0.1.40", default-features = false, features = ["attributes"] }
tracing-subscriber = { version = "0.3.18" } # There's hardly any reason to disable its default features.
tracing-appender = { version = "0.2", default-features = false }
tracing-test = { version = "0.2.5", features = [
    "no-env-filter",
] } # https://docs.rs/tracing-test/latest/tracing_test/#per-crate-filtering
utoipa = "5.4"
utoipa-swagger-ui = { version = "9.0", features = ["axum", "debug-embed", "vendored"] }
unwrap-infallible = "0.1.5"
bech32 = { version = "0.11" }
derive_more = { version = "2.0", default-features = false, features = ["std"] }
clap = { version = "4.5.16", features = ["derive"] }
toml = { version = "0.8.19", features = ["parse"] }
jsonrpsee = { version = "0.26.0", default-features = false }
jsonrpsee-types = { version = "0.26.0", default-features = false }
jsonrpsee-core = { version = "0.26.0", default-features = false }
schemars = { version = "1.2", features = ["derive"] }
tempfile = "3.20.0"
testcontainers = "0.27.0"
testcontainers-modules = "0.15.0"
test-strategy = "0.4.0"
tokio = { version = "1.42.2", default-features = false }
tokio-stream = { version = "0.1", features = ["sync"] }
tokio-tungstenite = { version = "0.29.0", default-features = false }
tungstenite = "0.29.0"
uuid = { version = "1.10", default-features = false } # v1.9 is important because it guarantees monotic UUIDv7 generation: https://github.com/uuid-rs/uuid/releases/tag/1.9.0.
num_cpus = "1.16"
ruint = { version = "1", default-features = false }
risc0-zkvm = { version = "3.0", default-features = false }
risc0-zkvm-platform = "2.2"
risc0-build = "3.0"
# All sp1-* and slop-* crates ship from the same SP1 release and must be upgraded
# in lockstep. Self-rooted zkvm-guest workspaces
# (examples/demo-rollup/provers/sp1/guest-* and crates/adapters/sp1/fibonacci-program)
# pin their own sp1-zkvm version explicitly because [patch.crates-io] requires
# a workspace root and prevents `workspace = true` inheritance. See also the
# sha2 / ed25519-dalek pinning notes above.
slop-algebra = { version = "6.2.2", default-features = false }
sp1-build = { version = "6.2.2", default-features = false }
sp1-lib = { version = "6.2.2", default-features = false }
sp1-primitives = { version = "6.2.2", default-features = false }
sp1-recursion-executor = { version = "6.2.2", default-features = false }
sp1-sdk = { version = "6.2.2", default-features = false }
sp1-verifier = { version = "6.2.2", default-features = false }
# sp1-zkvm keeps default features (`libm`, `lib`) because sov-sp1-adapter
# relies on them via the guest-side `verify` feature dependency chain.
sp1-zkvm = { version = "6.2.2" }
flume = { version = "0.11.1", features = ["async"] }
tokio-metrics = { version = "0.4.0" }

# EVM dependencies
ethereum-types = { version = "0.14.1", default-features = false }

alloy = { version = "1.8.3", default-features = false, features = ["std", "essentials"] }
alloy-serde = { version = "1.8.3", default-features = false }
alloy-pubsub = { version = "1.8.3", default-features = false }
alloy-primitives = { version = "1.4.1", default-features = false }
alloy-sol-types = { version = "1.4.1", default-features = false }
alloy-dyn-abi = { version = "1.4.1", default-features = false }
alloy-eips = { version = "1.8.3", default-features = false }
alloy-consensus = { version = "1.8.3", default-features = false }
alloy-contract = { version = "1.8.3", default-features = false }
alloy-transport = { version = "1.8.3", default-features = false }
alloy-rpc-types = { version = "1.8.3", features = [
    "eth",
], default-features = false }
alloy-rpc-types-eth = { version = "1.8.3", default-features = false }

alloy-provider = { version = "1.8.3", default-features = false, features = ["ws"] }
alloy-rpc-types-trace = { version = "1.8.3", default-features = false }
alloy-signer = { version = "1.8.3", default-features = false }
alloy-signer-local = { version = "1.8.3", default-features = false }
alloy-rlp = { version = "0.3.12", default-features = false }
revm = { version = "31.0.0", features = ["serde"], default-features = false }
revm-database-interface = { version = "8.0.4", default-features = false }
revm-inspectors = { version = "0.32.0", default-features = false }
secp256k1 = { version = "=0.30.0", default-features = false, features = [
    "global-context",
    "recovery",
] }
k256 = { version = "0.13.4", default-features = false, features = ["ecdsa", "std"] }
quick_cache = "0.6.16"
# End of EVM dependencies

[profile.rust-analyzer-optimized]
inherits = "dev"
debug = false
strip = true
codegen-units = 256


[profile.dev.package.sov-modules-macros]
# Set the optimization level to 3 for the sov-modules-macros crate. This
# should reduce build times for other packages.
opt-level = 3

[profile.release-with-opt-level-0]
inherits = "release"
opt-level = 0

[workspace.metadata.dylint]
libraries = [
    { git = "ssh://git@github.com/Sovereign-Labs/sdk-lints.git" },
]

[profile.coverage]
inherits = "dev"
# enough for coverage, smaller DWARF
debug = 1
# reduce linker RAM
lto = "off"
# lower per-unit peak
codegen-units = 16
# lighter binaries if acceptable
panic = "abort"
