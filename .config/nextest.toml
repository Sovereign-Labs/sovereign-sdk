[profile.default]
# Terminate any test that takes longer than 7 minutes
slow-timeout = { period = "60s", terminate-after = 7 }

[[profile.default.overrides]]
filter = 'test(flaky_)'
retries = { backoff = "fixed", count = 5, delay = "1s", jitter = true }
# Terminate any test that takes longer than 7 minutes
slow-timeout = { period = "60s", terminate-after = 7 }

# Hyperlane e2e tests spawns docker with relayer, validators and evm
# thus they need to fight for cpu. Giving them more space makes
# them more stable and allows for overall faster execution.
[[profile.default.overrides]]
filter = 'package(sov-hyperlane-integration) & test(/with_agent::/)'
priority = 90                                                        # try to run it first, so it doesn't add up at the end
threads-required = 3

[[profile.default.overrides]]
filter = 'not test(heavy_)'

[[profile.default.overrides]]
filter = 'package(sov-sequencer) & test(/pinned_cache::/)'
priority = 90                                                        # try to run it first, so it doesn't add up at the end
threads-required = 3

[[profile.default.overrides]]
filter = 'package(sov-sequencer) & test(/flaky_test_archival_state_is_immediately_available/)'
priority = 95
threads-required = 3

[[profile.default.overrides]]
filter = 'package(sov-sequencer) & test(/seq_behind_deferred_slots_count|test_no_crashes_on_resync|sequencer_back_pressure|heavy_blob_submission/)'
test-group = 'heavy-sequencer-tests'
threads-required = 4                                                 # Limit parallelism when these tests run
slow-timeout = { period = "60s", terminate-after = 10 }              # These tests need up to 10 minutes under load

# This test has a race condition in archival state queries under load - needs full isolation
[[profile.default.overrides]]
filter = 'package(sov-sequencer)'
threads-required = 'num-cpus'

[test-groups.heavy-sequencer-tests]
max-threads = 2

[[profile.default.overrides]]
filter = 'package(sov-demo-rollup) & test(/replica::/)'
priority = 90                                                        # try to run it first, so it doesn't add up at the end
threads-required = 3



[profile.ci]
default-filter = 'all()'
