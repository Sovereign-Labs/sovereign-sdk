[package]
name = "sov-ethereum"
authors = { workspace = true }
edition = { workspace = true }
homepage = { workspace = true }
license = { workspace = true }
repository = { workspace = true }

version = { workspace = true }
readme = "README.md"
publish = false

[lints]
workspace = true

[dependencies]
tracing = { workspace = true }
jsonrpsee = { workspace = true, features = ["http-client", "server", "jsonrpsee-types"] }
sov-address = { workspace = true, features = ["evm"] }

sov-evm = { workspace = true, features = ["native"] }
sov-bank = { workspace = true, features = ["native"] }
sov-uniqueness = { workspace = true, features = ["native"] }
sov-modules-api = { workspace = true, features = ["native"] }
sov-modules-stf-blueprint = { workspace = true, features = ["native"] }
sov-sequencer = { workspace = true }
sov-eth-dev-signer = { workspace = true }
sov-metrics = { workspace = true, features = ["native"] }
sov-rest-utils = { workspace = true }

borsh = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }

alloy-consensus = { workspace = true }
alloy-primitives = { workspace = true }
alloy-rpc-types = { workspace = true }
alloy-eips = { workspace = true }
sov-rpc-eth-types = { workspace = true }
hex = { workspace = true }
thiserror = { workspace = true }
derive_more = { workspace = true }
tokio = { workspace = true, features = ["sync"] }

[dev-dependencies]
anyhow = { workspace = true }
futures = { workspace = true }
proptest = { workspace = true }
strum = { workspace = true }
test-strategy = { workspace = true }

# Enable test-only cfgs on this crate for the integration test target.
# `local` registers eth_accounts / eth_sendTransaction handlers.
sov-ethereum = { path = ".", features = ["local"] }

sov-mock-da = { workspace = true, features = ["native"] }
sov-rollup-interface = { workspace = true }
sov-api-spec = { workspace = true }
sov-stf-runner = { workspace = true }
sov-cli = { workspace = true }
sov-state = { workspace = true }
sov-kernels = { workspace = true, features = ["native"] }
sov-accounts = { workspace = true }
sov-paymaster = { workspace = true, features = ["native"] }
sov-blob-storage = { workspace = true }
sov-test-utils = { workspace = true }

alloy = { workspace = true, features = ["signers", "transport-http"] }
alloy-provider = { workspace = true, features = ["debug-api", "reqwest", "ws"] }
alloy-pubsub = { workspace = true }
alloy-rpc-types-eth = { workspace = true }
alloy-rpc-types-trace = { workspace = true }
sov-full-node-configs = { workspace = true }
reqwest = { workspace = true, features = ["json"] }
schemars = { workspace = true }
sov-eth-client = { workspace = true }
sov-evm-test-utils = { workspace = true }
secp256k1 = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt", "rt-multi-thread"] }
tempfile = { workspace = true }
tracing-subscriber = { workspace = true }

[features]
default = []
local = [
	"sov-ethereum/local"
]
