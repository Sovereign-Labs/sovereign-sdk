[workspace]
members = ["program", "script"]
default-members = ["script"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"

[workspace.dependencies]
anyhow = "1.0.95"
bincode = "1.3.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10.8"
sp1-build = "6.0.2"
sp1-core-executor = "6.0.2"
sp1-sdk = { version = "6.0.2", default-features = false, features = ["blocking"] }
sp1-zkvm = { version = "6.0.2" }
sov-mock-da = { path = "../../adapters/mock-da", default-features = false }
sov-mock-zkvm = { path = "../../adapters/mock-zkvm", default-features = false }
sov-modules-api = { path = "../../module-system/sov-modules-api", default-features = false }
sov-rollup-interface = { path = "../../rollup-interface", default-features = false }
sov-sp1-adapter = { path = "../../adapters/sp1", default-features = false }
sov-state = { path = "../../module-system/sov-state", default-features = false }
sov-zkvm-utils = { path = "../../utils/sov-zkvm-utils" }
