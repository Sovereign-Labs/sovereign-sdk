[package]
name = "sov-shutdown"
description = "Shutdown controllers and graceful-shutdown utilities for Sovereign SDK full nodes"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
homepage.workspace = true
publish = true
repository.workspace = true

[lints]
workspace = true

[dependencies]
tokio = { workspace = true, features = ["macros", "sync", "rt"] }
tracing = { workspace = true }
tracing-panic = { version = "0.1.2", default-features = false, features = [
    "capture-backtrace",
] }

[dev-dependencies]
sov-test-utils = { workspace = true }
tokio = { workspace = true, features = ["macros", "sync", "rt-multi-thread"] }
tracing-subscriber = { workspace = true }
tracing-test = { workspace = true }
