[package]
name = "sov-chain-config"
description = "Patchable chain configuration: the embedded binary record format and constants.toml parsing"
authors = { workspace = true }
edition = { workspace = true }
homepage = { workspace = true }
license = { workspace = true }
repository = { workspace = true }
version = { workspace = true }

[lints]
workspace = true

[dependencies]
borsh = { workspace = true }
hex = { workspace = true }
serde = { workspace = true, optional = true }
sha2 = { workspace = true }
thiserror = { workspace = true }
toml = { workspace = true, optional = true }

[dev-dependencies]
sov-chain-config = { path = ".", features = ["toml"] }

[features]
# Parsing chain-identity values from `constants.toml` documents.
toml = ["dep:serde", "dep:toml"]
