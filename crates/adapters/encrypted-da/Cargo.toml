[package]
name = "sov-encrypted-da"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
homepage.workspace = true
repository.workspace = true
publish.workspace = true

[features]
default = ["aes-encryption"]
aes-encryption = ["sov-encryption/aes-encryption"]
mock-da = ["dep:sov-mock-da"]

[dependencies]
# Core dependencies
sov-rollup-interface = { git = "ssh://git@github.com/Sovereign-Labs/sovereign-sdk.git", rev = "4671d116445263ba2e886056294b9eedb9779ba1", features = ["native"] }
sov-encryption = { path = "../../utils/sov-encryption" }

# Async and utilities
async-trait = { workspace = true }
tokio = { workspace = true, features = ["sync", "rt", "rt-multi-thread"] }
futures = { workspace = true }

# Serialization
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }

# Additional dependencies for enhanced service
hex = { workspace = true }
sha2 = { workspace = true }
chrono = { workspace = true, features = ["serde"] }

# Error handling
thiserror = { workspace = true }
anyhow = { workspace = true }

# Logging
tracing = { workspace = true }

# JSON Schema for configuration
schemars = { workspace = true, features = ["derive"] }

# Optional dependencies for features
sov-mock-da = { git = "ssh://git@github.com/Sovereign-Labs/sovereign-sdk.git", rev = "4671d116445263ba2e886056294b9eedb9779ba1", optional = true, features = ["native"] }

[dev-dependencies]
sov-mock-da = { git = "ssh://git@github.com/Sovereign-Labs/sovereign-sdk.git", rev = "4671d116445263ba2e886056294b9eedb9779ba1", features = ["native"] }
sov-celestia-adapter = { git = "ssh://git@github.com/Sovereign-Labs/sovereign-sdk.git", rev = "4671d116445263ba2e886056294b9eedb9779ba1", features = ["native"] }
tokio-test = "0.4"
tempfile = { workspace = true }
chrono = { workspace = true, features = ["serde"] }
tracing-subscriber = { workspace = true }
toml = { workspace = true }
base64 = "0.21"
aes-gcm = "0.10"
rand = { workspace = true }


[lints]
workspace = true