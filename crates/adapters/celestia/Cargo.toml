[package]
name = "sov-celestia-adapter"
description = "Celestia DA adapter for Sovereign SDK rollups"
version = "0.3.0"
edition.workspace = true
license.workspace = true
authors.workspace = true
homepage.workspace = true
repository.workspace = true
publish = true

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lints]
workspace = true

[dependencies]
borsh = { workspace = true, features = ["derive", "bytes"] }
bech32 = { workspace = true }
prost = "0.13"

# Upgrade with care. The new version might be incompatible and require run of soak tests
# TODO: Remove celestia-rpc when migration to client completed.
celestia-types = { version = "0.16.0", default-features = false }
celestia-client = { version = "0.2.0", default-features = false, optional = true }
tendermint = { version = "0.40.4", default-features = false }
tendermint-proto = { version = "0.40.4" }
nmt-rs = { workspace = true, features = ["serde", "borsh"] }

# Convenience
anyhow = { workspace = true }
arbitrary = { workspace = true, features = ["derive"], optional = true }
async-trait = { workspace = true }
backon = { workspace = true, optional = true }
derive_more = { workspace = true, default-features = false, features = ["std"] }
futures = { workspace = true, default-features = false, optional = true }
hex = { workspace = true, features = ["serde"] }
proptest = { workspace = true, features = ["alloc", "std"], optional = true }
schemars = { workspace = true, features = ["derive"] }
serde = { workspace = true, default-features = false, features = [
    "alloc",
    "derive",
] }
serde_json = { workspace = true, features = ["alloc"] }

thiserror = { workspace = true }
tokio = { workspace = true, optional = true, features = ["sync"] }
tower = { workspace = true, optional = true }
tracing = { workspace = true }
# Used by the checker.
rand = { workspace = true, optional = true }

sov-metrics = { workspace = true, optional = true }
sov-modules-macros = { workspace = true, optional = true }
sov-rollup-interface = { workspace = true }

[dev-dependencies]
postcard = { version = "1", features = ["use-std"] }
bip39 = { version = "2.2.0", features = ["default", "zeroize"] }
bip32 = { version = "0.5.3" }
bcrypt = { version = "0.15" }
xsalsa20poly1305 = { version = "0.9" }
base64 = { version = "0.22" }
sha2 = { version = "0.10" }
reltester = { workspace = true }
sov-celestia-adapter = { path = ".", features = ["native", "arbitrary"] }
sov-test-utils = { workspace = true, features = ["arbitrary"] }
wiremock = "0.6"
tonic = "0.12"
tokio-stream = { version = "0.1", features = ["net"] }
prost-types = "0.13"
http = "1.0"
http-body-util = "0.1"
bytes = "1.0"
test-strategy = { workspace = true }
tokio = { workspace = true, features = [
    "test-util",
    "macros",
    "rt-multi-thread",
] }
# For serialization testing
risc0-zkvm = { workspace = true, features = ["std"] }
risc0-zkvm-platform = { workspace = true }
bincode = { workspace = true }
rand = { workspace = true, features = ["small_rng"] }

[features]
default = []
native = [
    "backon",
    "tendermint/default",
    "dep:celestia-client",
    "dep:futures",
    "dep:tokio",
    "sov-celestia-adapter/native",
    "sov-rollup-interface/native",
    "dep:sov-metrics",
    "sov-metrics/native",
    "dep:tower",
    "sov-modules-macros?/native",
    "dep:rand",
]
bench = [
    "dep:sov-metrics",
    "sov-modules-macros/bench",
    "sov-celestia-adapter/bench",
]
arbitrary = [
	"dep:arbitrary",
	"dep:proptest",
	"sov-celestia-adapter/arbitrary",
	"sov-rollup-interface/arbitrary",
	"sov-test-utils/arbitrary",
	"prost-types/arbitrary",
	"sov-modules-macros?/arbitrary"
]
