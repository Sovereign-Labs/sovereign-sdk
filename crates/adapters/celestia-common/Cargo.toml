[package]
name = "sov-celestia-common"
description = "Shared Celestia header, namespace-proof and node-client code for Sovereign DA adapters"
version = "0.3.0"
edition.workspace = true
license.workspace = true
authors.workspace = true
homepage.workspace = true
repository.workspace = true
publish = true

[lints]
workspace = true

[dependencies]
borsh = { workspace = true, features = ["derive", "bytes"] }
bech32 = { workspace = true }
prost = "0.13"

celestia-types = { version = "1.2.0", default-features = false }
tendermint = { version = "0.40.4", default-features = false }
tendermint-proto = { version = "0.40.4" }
nmt-rs = { workspace = true, features = ["serde", "borsh"] }

anyhow = { workspace = true }
arbitrary = { workspace = true, features = ["derive"], optional = true }
backon = { workspace = true, optional = true }
celestia-client = { version = "1.2.0", optional = true }
derive_more = { workspace = true, default-features = false, features = ["std"] }
futures = { workspace = true, default-features = false, optional = true }
hex = { workspace = true, features = ["serde"] }
proptest = { workspace = true, features = ["alloc", "std"], optional = true }
schemars = { workspace = true, features = ["derive"] }
serde = { workspace = true, default-features = false, features = [
    "alloc",
    "derive",
] }
serde_json = { workspace = true, features = ["alloc"] }
sov-metrics = { workspace = true, optional = true }
sov-rollup-interface = { workspace = true }
sov-universal-wallet = { workspace = true, features = ["macros"] }
thiserror = { workspace = true }
tokio = { workspace = true, optional = true, features = ["macros", "time"] }
tracing = { workspace = true }

[dev-dependencies]
sov-celestia-common = { path = ".", features = ["native", "arbitrary"] }

[features]
default = []
native = [
    "backon",
    "tendermint/default",
    "dep:celestia-client",
    "dep:futures",
    "dep:tokio",
    "sov-rollup-interface/native",
    "dep:sov-metrics",
    "sov-metrics/native",
    "sov-celestia-common/native",
]
bench = ["sov-celestia-common/bench"]
arbitrary = [
    "dep:arbitrary",
    "dep:proptest",
    "sov-rollup-interface/arbitrary",
    "sov-celestia-common/arbitrary",
]
