[package]
name = "sov-avail-adapter"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
homepage.workspace = true
publish.workspace = true
repository.workspace = true

[lints]
workspace = true

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
borsh = { workspace = true, features = ["bytes"] }
sov-rollup-interface = { workspace = true }
bytes = { version = "1.2.1", features = ["serde"] }
primitive-types = { version = "0.12.2", features = ["serde"] }
sp-core-hashing = "16.0.0"
avail-rust = { git = "https://github.com/availproject/avail-rust", tag = "v0.1.9" }
codec = { package = "parity-scale-codec", version = "3.0.0", default-features = false, features = [
    "derive",
    "full",
    "bit-vec",
], optional = true }

# Convenience
tokio = { workspace = true, optional = true }
futures = { workspace = true, optional = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true, features = ["fmt"] }
async-trait = { workspace = true }
anyhow = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
reqwest = { workspace = true, features = [
    "rustls-tls",
    "json",
], default-features = false, optional = true }
thiserror = { workspace = true }
sp-keyring = { version = "24", optional = true }
sp-core = { version = "21", optional = true }
hex = { workspace = true }

[dev-dependencies]
static_assertions = "1"


[features]
default = ["native"]
native = [
    "dep:codec",
    "dep:futures",
    "dep:reqwest",
    "dep:sp-core",
    "dep:sp-keyring",
    "dep:tokio",
    "sov-rollup-interface/native",
]
