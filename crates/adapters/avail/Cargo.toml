[package]
name = "sov-avail-adapter"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
homepage.workspace = true
publish.workspace = true
repository.workspace = true

[lints]
workspace = true

[dependencies]
avail-rust = { git = "https://github.com/availproject/avail-rust", tag = "v0.1.9" }
sov-rollup-interface = { workspace = true }
borsh = { workspace = true, features = ["bytes"] }
bytes = { version = "1.2.1", features = ["serde"] }
primitive-types = { version = "0.12.2", features = ["serde"] }
sp-core-hashing = "16.0.0"
async-trait = { workspace = true }
serde = { workspace = true }
schemars = { workspace = true, features = ["derive"] }
anyhow = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true, features = ["fmt"] }
serde_json = { workspace = true }
thiserror = { workspace = true }
hex = { workspace = true }

# Optional dependencies used only in native mode or for testing
codec = { package = "parity-scale-codec", version = "3.0.0", default-features = false, features = [
    "derive",
    "full",
    "bit-vec",
], optional = true }
futures = { workspace = true, optional = true }
tokio = { workspace = true, optional = true }
reqwest = { workspace = true, features = [
    "rustls-tls",
    "json",
], default-features = false, optional = true }
sp-core = { version = "21", optional = true }
sp-keyring = { version = "24", optional = true }
backon = { workspace = true, optional = true }

[features]
default = ["native"]
native = [
    "dep:codec",
    "dep:futures",
    "dep:reqwest",
    "dep:sp-core",
    "dep:sp-keyring",
    "dep:tokio",
    "dep:backon",
    "sov-rollup-interface/native",
]

[dev-dependencies]
static_assertions = "1"
