[package]
name = "sov-celestia-fibre-adapter"
description = "Celestia Fibre DA adapter for Sovereign SDK rollups"
version = "0.3.0"
edition.workspace = true
license.workspace = true
authors.workspace = true
homepage.workspace = true
repository.workspace = true
publish = false

[lints]
workspace = true

[dependencies]
anyhow = { workspace = true }
borsh = { workspace = true, features = ["derive", "bytes"] }
bytes = { workspace = true, features = ["serde"] }
schemars = { workspace = true, features = ["derive"] }
serde = { workspace = true, default-features = false, features = [
    "alloc",
    "derive",
] }

sov-celestia-adapter = { workspace = true }
sov-rollup-interface = { workspace = true }

async-trait = { workspace = true, optional = true }
celestia-client = { version = "1.2.0", optional = true }
celestia-grpc = { version = "1.2.0", default-features = false, optional = true }
hex = { workspace = true, optional = true }
tokio = { workspace = true, optional = true, features = ["sync"] }
tracing = { workspace = true }

[features]
default = []
native = [
    "dep:async-trait",
    "dep:celestia-client",
    "dep:celestia-grpc",
    "dep:hex",
    "dep:tokio",
    "sov-celestia-adapter/native",
    "sov-rollup-interface/native",
]
