[package]
name = "sov-celestia-fibre-adapter"
description = "Celestia Fibre DA adapter for Sovereign SDK rollups"
version = "0.3.0"
edition.workspace = true
license.workspace = true
authors.workspace = true
homepage.workspace = true
repository.workspace = true
publish = false

[lints]
workspace = true

[dependencies]
anyhow = { workspace = true }
borsh = { workspace = true, features = ["derive"] }
bytes = { workspace = true, features = ["serde"] }
schemars = { workspace = true, features = ["derive"] }
serde = { workspace = true, default-features = false, features = [
    "alloc",
    "derive",
] }
sha2 = { workspace = true }
# Only for its GF(2^16) log/exp tables, which must match the ones Fibre encodes with.
reed-solomon-simd = { version = "3.1.0", default-features = false }

# Same version as `sov-celestia-adapter`, whose header types this crate verifies against.
celestia-types = { version = "1.2.0", default-features = false }
sov-celestia-adapter = { workspace = true }
sov-rollup-interface = { workspace = true }

async-trait = { workspace = true, optional = true }
celestia-client = { version = "1.2.0", default-features = false, features = [
    "tls-native-roots",
], optional = true }
celestia-grpc = { version = "1.2.0", default-features = false, optional = true }
hex = { workspace = true, optional = true }
tokio = { workspace = true, optional = true, features = ["rt", "sync"] }
tracing = { workspace = true, optional = true }

[dev-dependencies]
# Tests and benches exercise the native service, and workspace builds can enable
# `sov-rollup-interface/native` (which adds `BlobReaderTrait::advance`) without ours.
sov-celestia-fibre-adapter = { path = ".", features = ["native"] }
serde_json = { workspace = true, features = ["std"] }

[features]
default = []
native = [
    "dep:async-trait",
    "dep:celestia-client",
    "dep:celestia-grpc",
    "dep:hex",
    "dep:tokio",
    "dep:tracing",
    "sov-celestia-adapter/native",
    "sov-celestia-fibre-adapter/native",
    "sov-rollup-interface/native",
]
