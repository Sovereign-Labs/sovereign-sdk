[package]
name = "sov-celestia-fibre-adapter"
description = "Celestia Fibre DA adapter for Sovereign SDK rollups"
version = "0.3.0"
edition.workspace = true
license.workspace = true
authors.workspace = true
homepage.workspace = true
repository.workspace = true
publish = true

[lints]
workspace = true

[dependencies]
anyhow = { workspace = true }
borsh = { workspace = true, features = ["derive"] }
celestia-types = { version = "1.2.0", default-features = false }
hex = { workspace = true, features = ["serde"] }
nmt-rs = { workspace = true, features = ["serde"] }
schemars = { workspace = true, features = ["derive"] }
serde = { workspace = true, default-features = false, features = ["alloc", "derive"] }
sha2 = { workspace = true }
sov-celestia-common = { workspace = true }
sov-rollup-interface = { workspace = true }
thiserror = { workspace = true }

async-trait = { workspace = true, optional = true }
backon = { workspace = true, optional = true }
celestia-client = { version = "1.2.0", optional = true }
celestia-fibre = { version = "1.2.0", optional = true }
sov-metrics = { workspace = true, optional = true }
sov-shutdown = { workspace = true, optional = true }
tokio = { workspace = true, optional = true, features = ["rt", "sync", "time"] }

[dev-dependencies]
sov-celestia-fibre-adapter = { path = ".", features = ["native"] }

[features]
default = []
native = [
    "dep:async-trait",
    "dep:backon",
    "dep:celestia-client",
    "dep:celestia-fibre",
    "dep:sov-metrics",
    "sov-metrics/native",
    "dep:sov-shutdown",
    "dep:tokio",
    "sov-celestia-common/native",
    "sov-rollup-interface/native",
    "sov-celestia-fibre-adapter/native",
]
bench = [
    "sov-celestia-common/bench",
    "sov-celestia-fibre-adapter/bench",
]
arbitrary = [
    "sov-celestia-common/arbitrary",
    "sov-rollup-interface/arbitrary",
    "sov-celestia-fibre-adapter/arbitrary",
]
