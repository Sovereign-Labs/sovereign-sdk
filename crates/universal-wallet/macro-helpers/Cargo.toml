[package]
name = "sov-universal-wallet-macro-helpers"
description = "Helper crate for sov-universal-wallet derive macros"
authors = { workspace = true }
version = "0.4.1"
edition = "2021"
license = "MIT OR Apache-2.0"
homepage = { workspace = true }
repository = { workspace = true }

[dependencies]
syn = { features = ["parsing", "derive"], workspace = true }
proc-macro2 = { workspace = true }
quote = { workspace = true }
darling = { workspace = true }
borsh = { workspace = true }
bs58 = { workspace = true }
bech32 = { workspace = true }
# Pinned exactly: serde_derive_internals is officially private API
# ("not subject to semver"). We use it to match serde's `rename_all`
# algorithm exactly, since `convert_case` produces different output for
# variants ending in digits (e.g. `DelegateUserV2` → `delegate_user_v_2`
# vs serde's `delegate_user_v2`). On serde upgrades, bump this pin to
# match the version that the workspace's `serde_derive` resolves to.
serde_derive_internals = "=0.29.1"
