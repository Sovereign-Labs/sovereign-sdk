[package]
name = "sov-hyperlane-integration"
description = "A Sovereign SDK module implementing a Hyperlane Mailbox"
authors = { workspace = true }
edition = { workspace = true }
homepage = { workspace = true }
license = { workspace = true }
repository = { workspace = true }

version = { workspace = true }
readme = "README.md"
publish = false

[lints]
workspace = true

[dev-dependencies]
sov-address = { workspace = true }
sov-api-spec = { workspace = true }
sov-hyperlane-integration = { path = ".", features = ["test-utils", "native", "arbitrary"] }
sov-mock-da = { workspace = true, features = ["native"] }
sov-modules-api = { workspace = true, features = ["native"] }
sov-sequencer = { workspace = true }
sov-state = { workspace = true, features = ["native"] }
sov-test-utils = { workspace = true, features = ["arbitrary"] }
sov-value-setter = { workspace = true, features = ["native"] }
secp256k1 = { workspace = true, features = ["rand"] }

base64 = { workspace = true }
flate2 = "1"
futures = { workspace = true }
hex = { workspace = true }
indoc = "2"
reqwest = { workspace = true }
strum = { workspace = true }
tempfile = { workspace = true }
testcontainers = { workspace = true }
testcontainers-modules = { workspace = true, features = ["anvil"] }
tokio = { workspace = true }
tokio-stream = { workspace = true }

[dependencies]
sov-address = { workspace = true, optional = true }
sov-bank = { workspace = true }
sov-metrics = { workspace = true, optional = true }
sov-modules-api = { workspace = true }
sov-state = { workspace = true }
anyhow = { workspace = true }
arbitrary = { workspace = true, optional = true }
borsh = { workspace = true, features = ["rc"] }
proptest-derive = { workspace = true, optional = true }
proptest = { workspace = true, optional = true }
derive_more = { workspace = true }
schemars = { workspace = true }
k256 = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
serde_yaml = { workspace = true }
sha3 = { workspace = true }
ruint = { workspace = true }
strum = { workspace = true }
tracing = { workspace = true }

[features]
default = []
evm = ["dep:sov-address", "sov-address?/evm"]
arbitrary = [
	"dep:proptest-derive",
	"dep:arbitrary",
	"dep:proptest",
	"sov-address?/arbitrary",
	"sov-bank/arbitrary",
	"sov-hyperlane-integration/arbitrary",
	"sov-modules-api/arbitrary",
	"sov-state/arbitrary",
	"ruint/arbitrary",
	"sov-mock-da/arbitrary",
	"sov-test-utils/arbitrary"
]
test-utils = []
native = [
	"sov-modules-api/native",
	"sov-value-setter/native",
	"sov-state/native",
	"sov-address?/native",
	"sov-bank/native",
	"sov-hyperlane-integration/native",
	"dep:sov-metrics",
	"sov-metrics/native",
	"sov-mock-da/native"
]
